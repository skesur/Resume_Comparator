{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resume Comparator{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'comparator/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="cyber-body">
    <!-- Cyberpunk Grid Overlay -->
    <div class="cyber-grid"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg cyber-navbar sticky-top shadow-lg">
        <div class="container">
            <a class="navbar-brand cyber-logo" href="{% url 'comparator:compare_form' %}">
                <i class="fa-solid fa-file-invoice-dollar text-cyan animate-pulse"></i> RESUME_COMPARATOR
            </a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5 cyber-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer cyber-footer text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 text-cyan-dim">[ SYSTEM_STATUS: ONLINE ] // &copy; 2026 RESUME_COMPARATOR // POWERED_BY_AI_ML</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
